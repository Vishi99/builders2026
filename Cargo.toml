[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
serde_json = "=1.0.145"

[features]
avx512-intrinsics = []
split-cuts = []
shared-worker-budget = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
